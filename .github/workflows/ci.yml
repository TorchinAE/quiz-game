name: CI/CD

on:
  push:
    branches: [quiz-game]
  pull_request:
    branches: [quiz-game]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --fix .
      - run: ruff format .
      - run: git diff --exit-code

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  deploy:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/quiz-game' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            git config --global --add safe.directory /home/mi/quiz-game
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            cd /home/mi/quiz-game
            git pull origin quiz-game
            sudo apt-get install -y python3.12-venv 2>/dev/null || true
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
            pkill -f "uvicorn.*app.main:app" || true
            nohup python3 -u -c "import uvicorn; uvicorn.run('app.main:app', host='0.0.0.0', port=8000)" > quiz-game.log 2>&1 &
