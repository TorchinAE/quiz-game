name: CI/CD

on:
  push:
    branches: [quiz-game]

  pull_request:
    branches: [quiz-game]


jobs:
  # ==========================================
  # LINT
  # ==========================================
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Run Ruff
        run: ruff check .


  # ==========================================
  # TEST
  # ==========================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml


  # ==========================================
  # DEPLOY
  # ==========================================
  deploy:
    needs: [lint, test]

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/quiz-game' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m

          script: |
            set -e

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            # --------------------------------------
            # Project
            # --------------------------------------

            cd /home/mi/quiz-game

            echo "Updating repository..."

            git config --global --add safe.directory /home/mi/quiz-game

            git remote set-url origin https://github.com/TorchinAE/quiz-game.git

            git fetch origin quiz-game

            git reset --hard origin/quiz-game

            # --------------------------------------
            # Python environment
            # --------------------------------------

            echo "Setting up Python environment..."

            python3 -m venv venv 2>/dev/null || true

            source venv/bin/activate

            python -m pip install --upgrade pip

            pip install -r requirements.txt

            # --------------------------------------
            # Nginx
            # --------------------------------------

            echo "Installing/configuring nginx..."

            sudo apt-get update -qq

            sudo apt-get install -y nginx

            sudo mkdir -p /etc/nginx/sites-available
            sudo mkdir -p /etc/nginx/sites-enabled

            sudo cp \
              nginx/quiz-game.conf \
              /etc/nginx/sites-available/quiz-game.conf

            sudo ln -sf \
              /etc/nginx/sites-available/quiz-game.conf \
              /etc/nginx/sites-enabled/quiz-game.conf

            sudo rm -f /etc/nginx/sites-enabled/default

            # --------------------------------------
            # Systemd service
            # --------------------------------------

            echo "Updating systemd service..."

            sudo cp quiz-game.service /etc/systemd/system/quiz-game.service
            sudo systemctl daemon-reload

            # --------------------------------------
            # Test nginx configuration
            # --------------------------------------

            echo "Testing nginx configuration..."

            sudo nginx -t

            # --------------------------------------
            # Reload nginx
            # --------------------------------------

            echo "Reloading nginx..."

            sudo systemctl reload nginx

            # --------------------------------------
            # Secrets
            # --------------------------------------

            echo "Writing .env from GitHub Secrets..."

            {
              echo "QUIZ_SECRET_KEY=${{ secrets.QUIZ_SECRET_KEY }}"
              echo "QUIZ_ADMIN_USERNAME=${{ secrets.QUIZ_ADMIN_USERNAME }}"
              echo "QUIZ_ADMIN_PASSWORD=${{ secrets.QUIZ_ADMIN_PASSWORD }}"
              echo "QUIZ_TELEGRAM_BOT_TOKEN=${{ secrets.QUIZ_TELEGRAM_BOT_TOKEN }}"
              echo "QUIZ_TELEGRAM_ADMIN_ID=${{ secrets.QUIZ_TELEGRAM_ADMIN_ID }}"
              echo "QUIZ_BACKUP_HOST=${{ secrets.QUIZ_BACKUP_HOST }}"
              echo "QUIZ_BACKUP_USER=${{ secrets.QUIZ_BACKUP_USER }}"
              echo "QUIZ_BACKUP_KEY=${{ secrets.QUIZ_BACKUP_KEY }}"
              echo "QUIZ_BACKUP_PATH=${{ secrets.QUIZ_BACKUP_PATH }}"
            } > /home/mi/quiz-game/.env

            chmod 600 /home/mi/quiz-game/.env

            # --------------------------------------
            # Restart application
            # --------------------------------------

            echo "Restarting quiz-game service..."

            sudo systemctl restart quiz-game

            # --------------------------------------
            # Check systemd service
            # --------------------------------------

            echo "Checking quiz-game service..."

            if ! sudo systemctl is-active --quiet quiz-game; then
              echo "ERROR: quiz-game service failed to start."
              echo ""
              echo "Service status:"
              sudo systemctl status quiz-game --no-pager || true
              echo ""
              echo "Application logs:"
              sudo journalctl -u quiz-game -n 100 --no-pager || true
              exit 1
            fi

            echo "quiz-game service is active."

            # --------------------------------------
            # Wait for application
            # --------------------------------------

            echo "Waiting for application on port 8080..."

            APP_READY=false

            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:8080/ > /dev/null 2>&1; then
                APP_READY=true
                echo "Application is responding."
                break
              fi

              echo "Application is not ready yet... attempt $i/30"
              sleep 1
            done

            # --------------------------------------
            # Application failed to start
            # --------------------------------------

            if [ "$APP_READY" != "true" ]; then
              echo "ERROR: Application did not become ready within 30 seconds."
              echo ""
              echo "Service status:"
              sudo systemctl status quiz-game --no-pager || true
              echo ""
              echo "Application logs:"
              sudo journalctl -u quiz-game -n 100 --no-pager || true
              exit 1
            fi

            # --------------------------------------
            # Check nginx
            # --------------------------------------

            echo "Checking nginx..."

            if sudo systemctl is-active --quiet nginx; then
              echo "nginx is running."
            else
              echo "ERROR: nginx is not running."
              sudo systemctl status nginx --no-pager || true
              exit 1
            fi

            # --------------------------------------
            # Complete
            # --------------------------------------

            echo "======================================"
            echo "Deploy complete!"
            echo "======================================"

      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.QUIZ_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.QUIZ_TELEGRAM_ADMIN_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          # Take first line of commit message, escape for JSON
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -n1 | sed 's/\\/\\\\/g; s/"/\\"/g')
          TEXT="✅ Деплой успешен%0A📦 quiz-game | \`${SHORT_SHA}\`%0A💬 ${FIRST_LINE}"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${TEXT}" \
            -d parse_mode="Markdown" \
            > /dev/null
