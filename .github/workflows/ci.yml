
name: CI/CD

on:
  push:
    branches: [quiz-game]

  pull_request:
    branches: [quiz-game]


jobs:
  # ==========================================
  # LINT
  # ==========================================
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Run Ruff
        run: ruff check .


  # ==========================================
  # TEST
  # ==========================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml


  # ==========================================
  # DEPLOY
  # ==========================================
  deploy:
    needs: [lint, test]

    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/quiz-game' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}

          command_timeout: 10m

          script: |
            set -e

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            # --------------------------------------
            # Project
            # --------------------------------------

            cd /home/mi/quiz-game

            echo "Updating repository..."

            git config --global --add safe.directory /home/mi/quiz-game

            git remote set-url origin https://github.com/TorchinAE/quiz-game.git

            git fetch origin quiz-game

            git reset --hard origin/quiz-game

            # --------------------------------------
            # Python environment
            # --------------------------------------

            echo "Setting up Python environment..."

            python3 -m venv venv 2>/dev/null || true

            source venv/bin/activate

            python -m pip install --upgrade pip

            pip install -r requirements.txt

            # --------------------------------------
            # Nginx
            # --------------------------------------

            echo "Installing/configuring nginx..."

            sudo apt-get update -qq

            sudo apt-get install -y nginx

            sudo mkdir -p /etc/nginx/sites-available
            sudo mkdir -p /etc/nginx/sites-enabled

            sudo cp \
              nginx/quiz-game.conf \
              /etc/nginx/sites-available/quiz-game.conf

            sudo ln -sf \
              /etc/nginx/sites-available/quiz-game.conf \
              /etc/nginx/sites-enabled/quiz-game.conf

            sudo rm -f /etc/nginx/sites-enabled/default

            # --------------------------------------
            # Nginx config test
            # --------------------------------------

            echo "Testing nginx configuration..."

            sudo nginx -t

            # --------------------------------------
            # Reload nginx
            # --------------------------------------

            echo "Reloading nginx..."

            sudo systemctl reload nginx

            # --------------------------------------
            # Restart application
            # --------------------------------------

            echo "Restarting quiz-game service..."

            sudo systemctl restart quiz-game

            # --------------------------------------
            # Check application service
            # --------------------------------------

            echo "Checking quiz-game service..."

            if sudo systemctl is-active --quiet quiz-game; then
              echo "quiz-game service is running."
            else
              echo "ERROR: quiz-game service failed to start."
              echo ""
              echo "Service status:"
              sudo systemctl status quiz-game --no-pager || true
              echo ""
              echo "Application logs:"
              sudo journalctl -u quiz-game -n 100 --no-pager || true
              exit 1
            fi

            # --------------------------------------
            # Check local application
            # --------------------------------------

            echo "Checking application on port 8080..."

            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              echo "Application is responding."
            else
              echo "ERROR: Application is not responding."
              echo ""
              echo "Application logs:"
              sudo journalctl -u quiz-game -n 100 --no-pager || true
              exit 1
            fi

            # --------------------------------------
            # Check nginx
            # --------------------------------------

            echo "Checking nginx..."

            if sudo systemctl is-active --quiet nginx; then
              echo "nginx is running."
            else
              echo "ERROR: nginx is not running."
              sudo systemctl status nginx --no-pager || true
              exit 1
            fi

            # --------------------------------------
            # Complete
            # --------------------------------------

            echo "======================================"
            echo "Deploy complete!"
            echo "======================================"

